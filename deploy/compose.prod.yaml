name: researchflow-prod

services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_URI: >-
        postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MILVUS_URI: ${MILVUS_DOCKER_URI:-http://host.docker.internal:19530}
      REDIS_URI: redis://:${REDIS_PASSWORD}@redis:6379/0
      LOG_FORMAT: json
      MCP_ISSUER_URL: https://${DOMAIN}
      MCP_RESOURCE_SERVER_URL: https://${DOMAIN}/mcp
      MCP_JWT_AUDIENCE: https://${DOMAIN}/mcp
    command:
      - sh
      - -c
      - python -m alembic upgrade head && uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../data:/app/data:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/api/v1/health/live', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  mcp:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    command:
      - python
      - -m
      - scripts.run_mcp_server
      - --transport
      - streamable-http
      - --host
      - 0.0.0.0
      - --port
      - "8001"
    env_file:
      - ../.env
    environment:
      POSTGRES_URI: >-
        postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MILVUS_URI: ${MILVUS_DOCKER_URI:-http://host.docker.internal:19530}
      REDIS_URI: redis://:${REDIS_PASSWORD}@redis:6379/0
      MCP_AUTH_ENABLED: "true"
      MCP_ISSUER_URL: https://${DOMAIN}
      MCP_RESOURCE_SERVER_URL: https://${DOMAIN}/mcp
      MCP_JWT_AUDIENCE: https://${DOMAIN}/mcp
    expose:
      - "8001"
    depends_on:
      api:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../data:/app/data:ro

  prometheus:
    image: prom/prometheus:v3
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      mcp:
        condition: service_started

volumes:
  postgres_data:
  prometheus_data:
  redis_data:
  caddy_data:
  caddy_config:
