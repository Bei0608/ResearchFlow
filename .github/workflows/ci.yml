name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q app scripts tests
      - name: Validate database migrations
        env:
          POSTGRES_URI: postgresql://user:password@localhost/researchflow
        run: python -m alembic upgrade head --sql > /dev/null
      - name: Run offline unit tests
        run: python -m pytest tests/unit -q -p no:cacheprovider
      - name: Run deterministic demo quality gate
        run: python -m scripts.evaluate_gate --fixture evaluations/demo/gate_check.json
      - name: Build production image
        run: docker build -t researchflow:${{ github.sha }} .

  empty-database-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: researchflow
          POSTGRES_PASSWORD: researchflow
          POSTGRES_DB: researchflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U researchflow -d researchflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_URI: postgresql://researchflow:researchflow@localhost:5432/researchflow
      RESEARCHFLOW_DEMO_PASSWORD: deterministic-demo-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Migrate empty database
        run: python -m alembic upgrade head
      - name: Bootstrap demo twice to verify idempotency
        run: |
          python -m scripts.bootstrap_demo_platform --username ci-demo
          python -m scripts.bootstrap_demo_platform --username ci-demo
